<head>
    <meta charset="UTF-8">

    <link rel="canonical" href="https://110187.xyz/pl/">
    <link rel="alternate" hreflang="pl" href="https://110187.xyz/pl/">
    <link rel="alternate" hreflang="en" href="https://110187.xyz/en/">
    <link rel="alternate" hreflang="x-default" href="https://110187.xyz/">
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0b1120">
    <style>body{background:#080c14;color:#e2e8f0;font-family:'Segoe UI',Arial,sans-serif;padding:2rem}a{color:#60a5fa}</style>
    <script>
        // Pick the language from the saved choice or the browser's preferred languages.
        (function () {
            var supported = ['pl', 'en'];
            var lang = null;
            try {
                var saved = localStorage.getItem('lang');
                if (supported.indexOf(saved) !== -1) lang = saved;
            } catch (e) { /* ignore */ }
            if (!lang) {
                var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
                for (var i = 0; i < prefs.length && !lang; i++) {
                    var code = String(prefs[i]).slice(0, 2).toLowerCase();
                    if (supported.indexOf(code) !== -1) lang = code;
                }
            }
            lang = lang || 'en';
            // Old hash-based links (/#cv) map to real pages
            var pages = { pl: { projekty: 'projekty/', cv: 'cv/', linki: 'linki/' }, en: { projekty: 'projects/', cv: 'cv/', linki: 'links/' } };
            var sub = pages[lang][window.location.hash.replace('#', '')] || '';
            window.location.replace('/' + lang + '/' + sub);
        })();
    </script>
</head>
<body>
    <noscript>
        <p><a href="/pl/">Polski</a> | <a href="/en/">English</a></p>
    </noscript>
</body>
